# ESQUEMA DEL CONTRATO DE INVESTIGACIÓN
# Fuente única de la verdad. La PLANTILLA.md de requested/ se deriva de aquí y el
# validador (research-validator.py) se guía por aquí.
# Si algo no está en este archivo, no es parte del contrato.
#
# Nombres y dominios siguen la convención del proceso de research que ya existía.
# No se renombran: la forma antigua es la correcta.

version: 1
nombre: contrato-investigacion
descripcion: >
  Contrato de entrada del proceso de investigación. Define estructura, obligatoriedad
  y formato. NO define contenido: qué se investiga y por qué ángulos lo aporta la fuente.

uuid:
  prefijo: "I-"
  longitud_cuerpo: 8
  patron_cuerpo: "[A-Za-z0-9]{8}"

presupuestos:
  descripcion: >
    Techo de trabajo por ángulo. El presupuesto NO es una meta: es el punto donde el
    investigador deja de buscar y entrega lo que tiene. Cuenta TODAS las llamadas de
    herramienta —buscar, abrir, leer el request y escribir el archivo—, no sólo las
    búsquedas: es el número que se puede contar sin discutir. Un ángulo sin presupuesto
    investiga hasta agotarse, y eso se mide en llamadas, no en calidad.
  niveles:
    corto:
      llamadas: 14
      fuentes: 6
    estandar:
      llamadas: 20
      fuentes: 10
    profundo:
      llamadas: 28
      fuentes: 15
  tope_duro:
    llamadas: 35
    fuentes: 20
  por_investigador:
    barato: corto
    experto: profundo
  por_defecto: estandar

campos:
  version_esquema:
    tipo: entero
    obligatorio: false
    correccion: version_actual
    descripcion: >
      Versión del contrato con la que se escribió el request. Si falta, la puerta
      pone la actual. Sirve para interpretar requests viejos cuando el esquema cambie.

  uuid:
    tipo: uuid
    obligatorio: true
    correccion: generar
    descripcion: Identidad de la investigación. Viaja por toda la cadena.

  tema:
    tipo: texto
    obligatorio: true
    min: 5
    max: 200
    descripcion: Título descriptivo de la investigación.

  fecha_solicitud:
    tipo: fecha
    obligatorio: true
    formato: "YYYY-MM-DD"
    correccion: hoy
    descripcion: Fecha en que se pidió.

  solicitante:
    tipo: texto
    obligatorio: true
    descripcion: "Quién pide. No se inventa: si falta, va a faltantes."

  origen:
    tipo: enum
    obligatorio: true
    dominio: [conversacion, mauro, proceso_externo]
    descripcion: >
      De dónde salió el pedido. conversacion = se acordó hablando (los ángulos
      pasaron por aprobación); mauro = lo escribió él mismo; proceso_externo = lo
      generó un proceso sin intervención humana en el medio.

  estado:
    tipo: enum
    obligatorio: true
    dominio: [requested, processing, ready, waiting]
    correccion: requested
    descripcion: >
      Etapa del ciclo. La puerta lo fija en requested al entrar. El recorrido es
      requested -> processing -> ready. `ready` es el final de una investigacion completa y
      exitosa despues del gate humano: ahi muere el proceso. `waiting` es una decision
      humana —la investigacion no se da por terminada hasta que exista un documento— y la
      escribe `approve` o `present`, nunca un barrido.

  tipo:
    tipo: enum
    obligatorio: true
    dominio: [negocio, mercado, paper, regulatorio, tecnico, general]
    descripcion: Naturaleza de la investigación.

  complejidad:
    tipo: enum
    obligatorio: false
    dominio: [simple, compleja]
    escrito_por: puerta
    descripcion: >
      La asigna la puerta, no la fuente. Debe ser coherente con modo.

  modo:
    tipo: enum
    obligatorio: false
    dominio: [delegate, research_swarm]
    escrito_por: puerta
    descripcion: >
      La asigna la puerta, no la fuente. delegate = investigación simple resuelta sin
      board; research_swarm = trabajo durable con un worker por ángulo.

  angulos_modo:
    tipo: enum
    obligatorio: false
    dominio: [todos, solo_estos]
    descripcion: >
      todos = el conjunto de ángulos es la descomposición completa y el orquestador
      puede agregar lo que falte. solo_estos = la lista es exactamente lo pedido y el
      orquestador NO agrega nada; sólo puede sugerir.

  angulos:
    tipo: lista_angulos
    obligatorio: false
    descripcion: >
      Unidades de trabajo, una por worker. Puede venir parcial: con sólo el título
      el orquestador completa lo demás. Se valida al SALIR del orquestador, no al entrar.
    campos:
      titulo:
        tipo: texto
        obligatorio: true
        descripcion: Nombre corto del ángulo.
      perspectiva:
        tipo: texto
        obligatorio: false
        descripcion: >
          Desde dónde se mira (legal, financiero, tecnico, usuario). Puede faltar:
          entonces el ángulo es un recorte del tema sin punto de vista declarado.
      alcance:
        tipo: texto
        obligatorio: false
        descripcion: "Qué incluye y qué NO incluye. El límite evita solapamiento."
      preguntas:
        tipo: lista
        obligatorio: false
        descripcion: Lo que el worker debe responder.
      fuentes_sugeridas:
        tipo: lista
        obligatorio: false
        descripcion: Pistas o URLs de arranque.
      salida:
        tipo: texto
        obligatorio: false
        descripcion: >
          Archivo que deja el worker, relativo a la carpeta de la investigación. El contenido es
          una ficha de hallazgos (ver el skill researcher-detective), no un informe redactado: el
          documento lo escribe el redactor. Nombre por convención:
          sources/researcher-<n>-<slug>.md para el detective y sources/expert-<n>-<slug>.md para
          el perito. Lo fija el orquestador al cerrar el ángulo.
      investigador:
        tipo: enum
        dominio: [barato, experto]
        obligatorio: false
        escrito_por: orquestador
        descripcion: >
          Quién investiga este ángulo. barato = el detective común, un modelo rápido.
          experto = el perito con motor MoE, para el ángulo donde el dato es caro de errar
          o las fuentes se contradicen. El default es barato: el experto es escaso por
          diseño, y un pedido con todos los ángulos en experto está mal descompuesto.

      presupuesto:
        tipo: enum
        dominio: [corto, estandar, profundo]
        obligatorio: false
        escrito_por: orquestador
        descripcion: >
          Techo de trabajo del ángulo: cuántas llamadas de herramienta y cuántas fuentes
          antes de entregar. La tabla concreta vive arriba, en `presupuestos.niveles`.
          Si falta, se deriva del investigador (barato→corto, experto→profundo) y sin
          nivel queda en estandar. Nadie entrega después del tope duro.

  instrucciones:
    tipo: texto
    obligatorio: true
    min: 100
    descripcion: Qué se necesita y para qué. El cuerpo del pedido.

  tags:
    tipo: lista
    obligatorio: false
    descripcion: Etiquetas para búsqueda y categorización.

  contexto_previo:
    tipo: lista_rutas
    obligatorio: false
    verificar_existencia: true
    descripcion: Rutas a material ya existente. Si una no existe, es defecto de formato.

  salida_expectada:
    tipo: objeto
    obligatorio: false
    descripcion: "Documento final. Si tipo viene lleno, formato y audiencia son obligatorios."
    campos:
      tipo:
        tipo: enum
        dominio: [propuesta, plan_negocio, pitch_deck, paper, informe, reporte]
      formato:
        tipo: enum
        dominio: [md, docx, pptx, pdf, xlsx]
      audiencia:
        tipo: enum
        dominio: [inversores, ONG, junta, cliente, interno]

  destino_post_investigacion:
    tipo: enum
    obligatorio: true
    dominio: [archivar_wiki, insumo_propuesta, entregar_tercero, informar_decision, dejar_en_entregas, documento]
    descripcion: >
      Que hacer con el resultado al terminar. `documento` significa una sola cosa para el
      research: la investigacion no esta completa hasta que el resultado pase por el presenter,
      asi que el gate humano la deja en `waiting` en vez de `ready`. El tipo de documento, el
      formato y el publico no son asunto del research: van en `especificacion_presentacion`.

  # ---- Campos escritos por las puertas, no por la fuente ----

  especificacion_presentacion:
    tipo: texto
    obligatorio: false
    descripcion: >
      Insumo para el presenter definido desde el pedido: normas de presentacion, tipo de pieza,
      publico. El research lo transporta tal cual y no lo interpreta.

  correcciones:
    tipo: lista
    escrito_por: puerta
    descripcion: Lo que la puerta arregló por tener un único valor correcto.

  faltantes:
    tipo: lista
    escrito_por: puerta
    descripcion: >
      Lo que la puerta no pudo resolver sin decidir por la fuente. Es la lista de
      trabajo del orquestador.

  listo_por:
    tipo: objeto
    escrito_por: orquestador
    campos:
      perfil:
        tipo: texto
      fecha:
        tipo: fecha

  notas_para_la_fuente:
    tipo: lista
    escrito_por: orquestador
    descripcion: >
      Lo que el orquestador tiene que decirle a la fuente: supuestos que hizo, valores
      fuera de dominio que mapeó, ángulos que sugiere y no creó (cuando angulos_modo es
      solo_estos), y datos que sólo la fuente tiene. No es un registro técnico: es la
      conversación pendiente con quien pidió la investigación.

  verificacion:
    tipo: enum
    dominio: ["si", "no"]
    obligatorio: false
    escrito_por: orquestador
    descripcion: >
      Si el resultado va a sostener una decisión, se verifica. Si el pedido es para saber,
      no se verifica y el ahorro es total. Cuando es si, el verificador toma sólo los
      hallazgos que el detective marcó como decisivos y contrasta cada uno contra la fuente
      que ese hallazgo ya citó: un acceso por claim, sin buscar y sin cadenas.

reglas:
  - nombre: coherencia_modo
    descripcion: complejidad y modo tienen que decir lo mismo.
    pares:
      simple: delegate
      compleja: research_swarm

  - nombre: documento_es_compleja
    descripcion: >
      Toda petición que termine en documento es compleja, aunque el tema parezca simple:
      el redactor necesita el brief validado.
    si_presente: salida_expectada.tipo
    entonces:
      complejidad: compleja
      modo: research_swarm

  - nombre: salida_completa
    descripcion: Un documento pedido a medias es un contrato incompleto.
    si_presente: salida_expectada.tipo
    entonces_obligatorio: [salida_expectada.formato, salida_expectada.audiencia]

  - nombre: angulos_si_son_solo_estos
    descripcion: "Si la fuente dijo que sólo esos ángulos, la lista no puede venir vacía."
    si:
      modo: research_swarm
      angulos_modo: solo_estos
    entonces_obligatorio: [angulos]
