name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint y sintaxis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install --quiet ruff

      - name: ruff (estilo y errores)
        run: ruff check .

      - name: ruff (formato)
        run: ruff format --check .

      - name: Sintaxis de todos los scripts
        run: python -m compileall -q $(git ls-files '*.py')

  secretos:
    name: Secretos en el rango
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
